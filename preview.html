<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/auto-render.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: transparent; }
  body {
    padding: 14px 16px;
    font: 14px/1.4 -apple-system, sans-serif;
    color: #1d1d1f;
    word-wrap: break-word;
    cursor: text;
    -webkit-user-select: none;
  }
  .empty { opacity: 0.4; }
  h1, h2, h3 { margin: 0 0 6px; line-height: 1.25; font-weight: 650; }
  h1 { font-size: 17px; }
  h2 { font-size: 15px; margin-top: 8px; }
  h3 { font-size: 14px; margin-top: 6px; }
  ul, ol { margin: 0 0 4px; padding-left: 1.2em; }
  li { margin: 0 0 4px; }
  li::marker { color: #8e8e93; }
  b { font-weight: 650; }
  .gap { height: 8px; }
  .tags { font-size: 11px; opacity: 0.55; margin-bottom: 6px; }
  .katex { font-size: 1.05em; }
  .katex-display { margin: 0.4em 0; overflow-x: auto; overflow-y: hidden; }
  @media (prefers-color-scheme: dark) { body { color: #f5f5f7; } }
</style>
</head>
<body>
<div id="note"></div>
<script>
  const note = document.getElementById('note');
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  // Matches {...} with one level of nested braces inside.
  const arg = '\\{((?:[^{}]|\\{[^{}]*\\})*)\\}';

  // A full LaTeX document or LaTeX text commands -> the markdown-ish form below.
  function fromLatex(t) {
    const doc = t.match(/\\begin\{document\}([\s\S]*?)(\\end\{document\}|$)/);
    if (doc) {
      const title = t.match(new RegExp('\\\\title' + arg));
      t = (title ? '# ' + title[1] + '\n' : '') + doc[1];
    }
    return t
      .replace(/^\s*%.*$/gm, '')
      .replace(/^\s*\\(maketitle|date\{.*\}|tableofcontents|newpage)\s*$/gm, '')
      .replace(/^\s*\\(begin|end)\{(itemize|enumerate|description|center)\}(\[.*?\])?\s*$/gm, '')
      .replace(new RegExp('\\\\section\\*?' + arg, 'g'), '\n## $1')
      .replace(new RegExp('\\\\subsection\\*?' + arg, 'g'), '\n### $1')
      .replace(/^(\s*)\\item\s*/gm, '$1- ')
      .replace(new RegExp('\\\\textbf' + arg, 'g'), '**$1**')
      .replace(new RegExp('\\\\(textit|emph)' + arg, 'g'), '<i>$2</i>')
      .replace(/\\%/g, '%')
      .replace(/``/g, '“').replace(/''/g, '”')
      .replace(/^(?!\s*---\s*$).*$/gm, l => l.replace(/---/g, '—'))
      .replace(/\\ldots(?![a-zA-Z])/g, '…')
      .replace(/\\\\\s*$/gm, '');
  }

  function inline(s) {
    return esc(s)
      .replace(/&lt;(\/?i)&gt;/g, '<$1>')
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/__(.+?)__/g, '<b>$1</b>');
  }

  function toHTML(text) {
    let lines = text.split('\n');
    let out = [], list = null;
    const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };

    // YAML frontmatter: show tags small, hide the rest.
    if (lines[0] && lines[0].trim() === '---') {
      const end = lines.findIndex((l, i) => i > 0 && l.trim() === '---');
      if (end > 0) {
        const tags = lines.slice(1, end).join(' ').match(/tags:\s*\[?([^\]]*)\]?/);
        if (tags) out.push('<div class="tags">' + esc(tags[1].split(',').map(x => '#' + x.trim()).join(' ')) + '</div>');
        lines = lines.slice(end + 1);
      }
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      let m;
      // Multi-line display maths: keep the whole block together for KaTeX.
      const opener = line.match(/^(\$\$|\\\[|\\begin\{([a-z*]+)\})/);
      if (opener) {
        const closer = opener[1] === '$$' ? '$$' : opener[1] === '\\[' ? '\\]' : '\\end{' + opener[2] + '}';
        let block = line;
        while (!block.slice(opener[1].length).includes(closer) && i + 1 < lines.length) block += '\n' + lines[++i];
        closeList();
        out.push('<div>' + esc(block) + '</div>');
      } else if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
        closeList();
        out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
      } else if ((m = line.match(/^[-*•]\s+(.*)/))) {
        if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
        out.push('<li>' + inline(m[1]) + '</li>');
      } else if ((m = line.match(/^\d+[.)]\s+(.*)/))) {
        if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
        out.push('<li>' + inline(m[1]) + '</li>');
      } else if (line === '' || line === '---') {
        closeList();
        if (out.length && out[out.length - 1] !== '<div class="gap"></div>') out.push('<div class="gap"></div>');
      } else {
        closeList();
        out.push('<div>' + inline(line) + '</div>');
      }
    }
    closeList();
    return out.join('');
  }

  function render(text) {
    if (!text.trim()) {
      note.className = 'empty';
      note.textContent = 'Click to write…  Markdown, $\\LaTeX$ maths and $$\\int f$$ all render.';
    } else {
      note.className = '';
      note.innerHTML = toHTML(fromLatex(text));
    }
    renderMathInElement(note, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false },
        { left: '\\begin{equation}', right: '\\end{equation}', display: true },
        { left: '\\begin{equation*}', right: '\\end{equation*}', display: true },
        { left: '\\begin{align}', right: '\\end{align}', display: true },
        { left: '\\begin{align*}', right: '\\end{align*}', display: true },
      ],
      throwOnError: false,
    });
  }
  document.addEventListener('mousedown', () => webkit.messageHandlers.edit.postMessage(1));
</script>
</body>
</html>
